<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Test 💖</title>

<style>
  body {
    font-family: Arial;
    background: #ffe6f0;
    text-align: center;
    padding: 40px;
  }

  .box {
    background: white;
    padding: 30px;
    border-radius: 15px;
    max-width: 500px;
    margin: auto;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }

  input, textarea {
    width: 90%;
    padding: 10px;
    margin: 8px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }

  button {
    background: #ff4da6;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
  }

  button:hover {
    background: #e60073;
  }
</style>
</head>

<body>

<div class="box">
  <h2>💖 Love Test 💖</h2>

  <!-- IMPORTANT: Replace your email below -->
  <form action="https://formsubmit.co/YOUR-EMAIL@gmail.com" method="POST">

    <input type="text" name="Your Name" placeholder="Your Name" required><br>
    <input type="text" name="GF Name" placeholder="Your GF Name 😏" required><br>

    <input type="text" name="Is she cute?" placeholder="Is your GF cute?" required><br>
    <input type="text" name="Do you love her?" placeholder="Do you love her?" required><br>
    
    <textarea name="Annoying Thing" placeholder="One annoying thing about her 😅"></textarea>

    <textarea name="Best Thing" placeholder="Best thing about her 💕"></textarea>

    <input type="text" name="Marriage Plan" placeholder="When are you planning to propose? 👀" required><br>

    <input type="text" name="Final Love Question" placeholder="Do you REALLY love her?" required><br>

    <textarea name="Message" placeholder="Message for your GF 💌"></textarea>

    <input type="hidden" name="_captcha" value="false">

    <br><br>
    <button type="submit">Submit 💘</button>

  </form>

  <p>Sending kisses for your GF 😘😘😘</p>
</div>

</body>
</html>
